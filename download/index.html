<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get GeneFox</title>
<meta name="description" content="Download GeneFox for iPhone, iPad, Mac and Android.">
<!-- Indexable, unlike /apple and /android: this is a real page with real content for
     anyone the script cannot place, and it is the link worth sharing when the sender
     does not know the recipient's device. -->
<link rel="canonical" href="https://genefox.app/download/">
<style>
  :root{
    --navy:#1B2547; --line-strong:rgba(150,163,214,.26);
    --pink:#D57BBA; --text:#E7E9F5; --muted:#9AA2C4;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--navy);color:var(--text);padding:2rem;text-align:center;
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  h1{font-size:1.4rem;margin:0 0 .4rem;letter-spacing:-.01em}
  p{margin:0 0 1.6rem;color:var(--muted)}
  .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .store-badge{display:inline-flex;align-items:center;gap:11px;padding:11px 18px 11px 16px;
    border-radius:13px;background:rgba(255,255,255,.04);border:1px solid var(--line-strong);
    text-decoration:none;transition:transform .18s,border-color .25s,background .25s}
  .store-badge:hover{transform:translateY(-2px);border-color:var(--pink);
    background:rgba(213,123,186,.08)}
  .store-badge svg{width:24px;height:24px;flex:none;fill:var(--text)}
  .store-badge span{display:flex;flex-direction:column;align-items:flex-start}
  .store-badge .sb-l{font-size:10.5px;color:var(--muted);letter-spacing:.04em;line-height:1.1}
  .store-badge .sb-b{font-weight:600;font-size:16px;letter-spacing:-.01em;color:var(--text);
    line-height:1.15}
  .home{margin-top:1.8rem;font-size:14px}
  .home a{color:var(--pink)}
  .cli{width:min(560px,calc(100vw - 4rem));margin-top:2.2rem}
  .cli h2{font-size:1rem;margin:0 0 .3rem;letter-spacing:-.01em}
  .cli p{margin:0 0 .9rem;font-size:14px}
  .cli a{color:var(--pink)}
  .cli-list{list-style:none;margin:0;padding:0;text-align:left}
  .cli-list li{padding:11px 0;border-top:1px solid var(--line-strong);font-size:14px}
  .cli-file{color:var(--muted);font-size:12px;word-break:break-all}
  .cli-meta{margin-top:4px;color:var(--muted);font-size:12px;word-break:break-all}
  .cli-hash{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .cli-pending{opacity:.75}
</style>
</head>
<body>
  <main>
    <h1>Get GeneFox</h1>
    <p>iPhone &middot; iPad &middot; Mac &middot; Android</p>
    <div class="row">
      <a class="store-badge" href="https://apps.apple.com/app/genefox/id6778824242" data-store="ios" aria-label="Download GeneFox on the App Store">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.37 1.43c.09 1.02-.32 2.02-.94 2.74-.66.77-1.74 1.36-2.79 1.28-.11-1 .38-2.03.97-2.68.66-.74 1.8-1.3 2.76-1.34zM20.6 17.2c-.53 1.22-.78 1.76-1.46 2.84-.95 1.5-2.29 3.36-3.95 3.37-1.47.02-1.85-.96-3.85-.95-2 .01-2.41.97-3.89.95-1.66-.02-2.93-1.7-3.88-3.19-2.65-4.18-2.93-9.08-1.3-11.69 1.17-1.86 3.01-2.95 4.74-2.95 1.76 0 2.87.97 4.33.97 1.42 0 2.28-.97 4.32-.97 1.54 0 3.17.84 4.33 2.29-3.8 2.08-3.19 7.5.46 9.28z"/></svg>
      <span><span class="sb-l">Download on the</span><span class="sb-b">App Store</span></span>
      </a>
      <a class="store-badge" href="https://play.google.com/store/apps/details?id=com.vds.GeneFox" data-store="play" aria-label="Get GeneFox on Google Play">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 2.3c-.3.3-.5.8-.5 1.4v16.6c0 .6.2 1.1.5 1.4l.1.1 9.3-9.3v-.2L3.6 2.3zm12.5 6.2L13.3 11l2.8 2.8 3.4-1.9c1-.6 1-1.5 0-2.1l-3.4-1.9zM13.9 11.6l-9 9c.4.2.9.1 1.5-.2l7.9-4.4-.4-.4zm-9-9.2l9 9 .4-.4L6.4 2.6c-.6-.3-1.1-.4-1.5-.2z"/></svg>
      <span><span class="sb-l">Get it on</span><span class="sb-b">Google Play</span></span>
      </a>
    </div>
    <section class="cli" id="cli" aria-labelledby="cli-h" hidden>
      <h2 id="cli-h">Command line</h2>
      <p id="cli-note"></p>
      <ul class="cli-list" id="cli-list"></ul>
    </section>
    <p class="home"><a href="/">genefox.app</a></p>
  </main>
  <script>
    // Send a phone or Mac straight to its own store; leave everyone else on this page.
    //
    // No <meta http-equiv="refresh"> here, unlike /apple and /android: those know their
    // destination from the URL alone, this one cannot know it without scripting. With
    // scripting off the page above IS the answer, which is why it is a real page rather
    // than a spinner.
    (function () {
      var ua = navigator.userAgent || "";
      // Android first. Its UA contains "Linux", and testing Apple first on some
      // Android builds would be a coin toss rather than a rule.
      if (/Android/i.test(ua)) {
        location.replace("https://play.google.com/store/apps/details?id=com.vds.GeneFox");
        return;
      }
      // iPadOS 13+ reports itself as "Macintosh", which is usually a nuisance and is
      // harmless here: an iPad and a Mac belong at the same store.
      if (/iPhone|iPad|iPod|Macintosh|Mac OS X/i.test(ua)) {
        location.replace("https://apps.apple.com/app/genefox/id6778824242");
        return;
      }
      // Windows, Linux, a console, a crawler: no store to send them to, so the page
      // stays put and offers both. Guessing here would strand the visitor.
    })();
  </script>
  <script>
    // The command-line downloads, from download/releases.json (written by
    // Scripts/cli-release/virustotal.py stage). Every value is checked before it is shown,
    // and text is set with textContent, never innerHTML. A missing or malformed file leaves
    // the list hidden; the store badges above are the page without it.
    (function () {
      var section = document.getElementById("cli");
      if (!section) return;
      var SHA = /^[0-9a-f]{64}$/;
      var VT = "https://www.virustotal.com/gui/file/";
      function el(tag, cls, text) {
        var node = document.createElement(tag);
        if (cls) node.className = cls;
        if (text != null) node.textContent = text;
        return node;
      }
      function https(value) { return typeof value === "string" && /^https:\/\//.test(value); }
      fetch("/download/releases.json", { cache: "no-cache" })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(function (data) {
          if (!data || !Array.isArray(data.artifacts)) return;
          if (data.placeholder) {
            document.getElementById("cli-note").textContent =
              "Placeholder data: not a release. Hashes and scan links appear once the release is staged.";
          }
          var list = document.getElementById("cli-list");
          data.artifacts.forEach(function (a) {
            var label = typeof a.label === "string" ? a.label : String(a.name || "");
            var item = el("li");
            var name = typeof a.name === "string" ? a.name : "";
            var title = el("div", "cli-title");
            if (https(a.url)) {
              var download = el("a", null, label);
              download.href = a.url;
              title.appendChild(download);
            } else {
              title.appendChild(el("span", null, label));
            }
            if (name) title.appendChild(el("div", "cli-file", name));
            item.appendChild(title);

            var meta = el("div", "cli-meta");
            var sha = typeof a.sha256 === "string" ? a.sha256 : "";
            if (SHA.test(sha)) {
              meta.appendChild(document.createTextNode("SHA-256 "));
              meta.appendChild(el("span", "cli-hash", sha));
            } else {
              meta.appendChild(el("span", "cli-pending", "SHA-256 pending"));
            }
            meta.appendChild(document.createTextNode("  \u00b7  "));
            if (SHA.test(sha) && a.permalink === VT + sha) {
              var scan = el("a", null, "VirusTotal scan");
              scan.href = a.permalink;
              scan.rel = "noopener";
              meta.appendChild(scan);
            } else {
              meta.appendChild(el("span", "cli-pending", "VirusTotal scan pending"));
            }
            item.appendChild(meta);
            list.appendChild(item);
          });
          section.hidden = false;
        })
        .catch(function () { /* Leave the list hidden. */ });
    })();
  </script>
</body>
</html>
