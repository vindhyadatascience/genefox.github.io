<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeneFox on Google Play</title>
<!-- Sends the visitor on before anything else parses. GitHub Pages serves static files
     only and cannot issue a real 301, so this redirect is client-side: the meta refresh
     fires without scripting, the script below beats it when scripting is on, and the
     visible link is the third fallback. -->
<meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.vds.GeneFox">
<link rel="canonical" href="https://play.google.com/store/apps/details?id=com.vds.GeneFox">
<!-- Not a destination page: it must not compete with the real pages in search. -->
<meta name="robots" content="noindex, follow">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #1B2547; color: #F4D7E7;
    /* System stack on purpose: a page whose only job is to disappear must not wait on a
       webfont to render its own fallback. */
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center; padding: 2rem;
  }
  a { color: #D57BBA; }
  p { margin: 0 0 1rem; }
</style>
</head>
<body>
  <main>
    <p>Taking you to GeneFox on Google Play&hellip;</p>
    <p><a href="https://play.google.com/store/apps/details?id=com.vds.GeneFox">Open Google Play</a></p>
  </main>
  <script>
    // replace(), not assign(): the redirect must leave no history entry, or Back from the
    // store lands here and bounces the visitor straight forward again.
    location.replace("https://play.google.com/store/apps/details?id=com.vds.GeneFox");
  </script>
</body>
</html>
